[/Script/Engine.InputSettings]
; Common UI routes input-mode tags through this class for both local players.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=DoNotLock
bEnableMouseSmoothing=False
; No developer console on the ~ key (it sits beside Esc, the pause key). Delete this line to get it back.
-ConsoleKeys=Tilde

; The engine binds debug commands to ordinary keys in development builds (F1-F5 view modes, ";" for a
; free camera, ...). They would fire in the middle of a bout, and ";" is player two's taunt key.
[/Script/Engine.PlayerInput]
!DebugExecBindings=ClearArray
